name: Deploy CODECRAFT to GitHub Pages

# Publishes the static site in codecraft/ to GitHub Pages.
# Site URL: https://affranphanjampee-art.github.io/kuroya/
# (repo name is the subpath; all site paths are relative so this works)

on:
  push:
    branches: [arena/6187de3a-kuroya]
    paths:
      - 'codecraft/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: codecraft
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
